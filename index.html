.seat{--angle:0deg}.seat[data-seat="1"]{--angle:-90deg}.seat[data-seat="2"]{--angle:180deg}.seat[data-seat="3"]{--angle:90deg}.front{height:55px;display:grid;place-items:center}.front img{transform:rotate(var(--angle));width:100%;max-width:42px}.seat:is([data-seat="1"],[data-seat="3"]) .river{grid-template-columns:repeat(auto-fit,minmax(0,54px));grid-auto-columns:minmax(0,54px)}.seat:is([data-seat="1"],[data-seat="3"]) .front{height:42px}.seat:is([data-seat="1"],[data-seat="3"]) .front img{width:76%}.seat small img{transform:rotate(var(--angle));margin:3px}

</style><link rel="stylesheet" href="/table.css"><header><span class="seal">雀</span><b>雀庭</b><span>立直对局室</span><small>M.LEAGUE 规则</small></header><main>
<section id="lobby"><div><div class="art" aria-hidden="true"></div><h1>好友牌桌</h1><p>四人立直麻将 · 东南半庄 · 赤牌三枚</p></div><div class="panel"><h2>入座</h2><label for="nick">雀士昵称</label><input id="nick" maxlength="12" placeholder="输入你的昵称"><button class="wide" id="create">创建房间</button><label for="code">已有房间号</label><div class="join"><input id="code" inputmode="numeric" maxlength="6" placeholder="六位房间号"><button class="secondary" id="join">加入</button></div></div></section>
<section id="room" hidden><div class="top"><h2 id="title"></h2><button class="secondary" id="sound"></button><button class="secondary" id="copy">复制邀请</button></div><div id="play"></div></section><div id="error" role="status"></div></main><footer>雀庭　 /　 四人对战 Demo　　 <a href="https://m-league.jp/about/" target="_blank" rel="noreferrer">M.LEAGUE 官方规则</a></footer>
<script src="/tiles.js"></script><script>
const el=id=>document.getElementById(id), winds='东南西北';
let auth=JSON.parse(sessionStorage.getItem('table')||'{}'), st,last='',busy=false;
const invited=new URLSearchParams(location.search).get('room');el('code').value=invited||'';if(invited&&invited!==auth.code)auth={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tiles(s){return [...s.matchAll(/([mpsz])([0-9]+)/g)].flatMap(m=>[...m[2]].map(n=>m[1]+n))}
function face(p){const n=+p[1]||5;return String.fromCodePoint(p[0]==='z'?0x1f000+[0,0,1,2,3,6,5,4][n]:({m:0x1f007,s:0x1f010,p:0x1f019}[p[0]])+n-1)+'︎'}
function tile(p){return modelTile(p)}
function riverMarkup(river){
 const rows=[];
 let pendingRiichi=false,visibleIndex=0;
 river.forEach((p,index)=>{
  const riichi=p.includes('*')||pendingRiichi;
  const called=/[+=-]$/.test(p);
  pendingRiichi=riichi&&called;
  if(called)return;
  const row=Math.floor(visibleIndex++/6);
  (rows[row]??=[]).push(discard(p,index===river.length-1,riichi));
 });
 return rows.map(row=>'<div class="river-row">'+row.join('')+'</div>').join('');
}
function discard(p,latest,riichi){
 const kind=p.includes('_')?'摸切':'手切';
 return '<div class="discard'+(riichi?' riichi-discard':'')+(latest?(p.includes('_')?' draw':' cut'):'')+'" title="'+tileName(p)+(latest?' · '+kind:'')+(riichi?' · 立直':'')+'"><div class="front">'+tile(p)+'</div>'+(latest?'<span>'+kind+'</span>':'')+'</div>';
}
let audioCtx, muted=localStorage.getItem('quiet')==='1', seen=null;
function soundLabel(){el('sound').textContent=muted?'音效：关':'音效：开';el('sound').setAttribute('aria-pressed',String(!muted))}
function unlock(){if(!muted && window.AudioContext){audioCtx??=new AudioContext();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}}
document.addEventListener('click',unlock);
el('sound').onclick=()=>{muted=!muted;localStorage.setItem('quiet',muted?'1':'0');soundLabel()};
soundLabel();
function cue(kind,delay){
 if(muted||audioCtx?.state!=='running')return;
 const start=audioCtx.currentTime+delay;
 const notes=kind==='stick'?[[780,.11],[1170,.16]]:kind==='dapai'?[[980,.038]]:[[740,.05],[920,.06]];
 notes.forEach(([hz,duration],i)=>{
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),at=start+i*.075;
  osc.type=kind==='stick'?'sine':'triangle';osc.frequency.setValueAtTime(hz,at);osc.frequency.exponentialRampToValueAtTime(hz*.56,at+duration);
  gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.07,at+.003);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
  osc.connect(gain).connect(audioCtx.destination);osc.start(at);osc.stop(at+duration+.01);
 });
}
function placeStick(offset){
 const origin=document.querySelector('[data-seat="'+offset+'"]'),target=el('pot');
 if(!origin||!target)return;
 const a=origin.getBoundingClientRect(),b=target.getBoundingClientRect(),stick=document.createElement('i');
 stick.className='flight stick';document.body.append(stick);
 const endX=b.left+b.width/2-24,endY=b.top+b.height/2-4;
 stick.style.left=endX+'px';stick.style.top=endY+'px';
 const dx=a.left+a.width/2-24-endX,dy=a.top+a.height/2-4-endY;
 const quiet=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const anim=stick.animate([{transform:quiet?'none':'translate('+dx+'px,'+dy+'px) rotate('+(-90*offset)+'deg)',opacity:.6},{transform:'none',opacity:1,offset:.8},{transform:'none',opacity:1}],{duration:quiet?200:720,easing:'ease-out'});
 anim.onfinish=()=>stick.remove();
}
function playEffects(t){
 const events=t.effects||[],end=events.at(-1)?.seq??0;
 if(seen!==null&&!document.hidden){events.filter(e=>e.seq>seen).forEach((e,i)=>{cue(e.kind,i*.08);if(['吃','碰','杠','荣和','自摸'].includes(e.kind))announce(e,t);if(e.kind==='stick')placeStick((e.seat-t.l+4)%4)})}
 seen=Math.max(seen??0,end);
}
document.querySelector('.art').innerHTML=['z7','s1','p1'].map(tile).join('');
async function call(op,extra={}){
 if(busy)return;busy=true;
 try{const res=await fetch('/api',{method:'POST',body:JSON.stringify({...auth,op,...extra})});const data=await res.json();if(data.error){if(op==='state'&&!res.ok){auth={};sessionStorage.removeItem('table');el('room').hidden=true;el('lobby').hidden=false}throw Error(data.error)}
 auth={code:data.code,token:data.token};sessionStorage.setItem('table',JSON.stringify(auth));st=data;
 if(last!==JSON.stringify(st)){last=JSON.stringify(st);render()}el('error').textContent='';
 }catch(e){el('error').textContent=e.message}finally{busy=false}
}
function meldGroup(m){
 const suit=m[0],parts=[...m.slice(1).matchAll(/([0-9])([+=-]?)/g)].map(v=>({p:suit+v[1],dir:v[2]}));
 const index=parts.findIndex(v=>v.dir);
 if(index<0)return '<div class="meld">'+parts.map((v,i)=>tile(i===0||i===3?'back':v.p)).join('')+'</div>';
 const extra=parts.length===4&&index===2?parts.pop():null;
 const called=parts.splice(index,1)[0];
 const position=called.dir==='-'?0:called.dir==='='?1:parts.length;
 parts.splice(position,0,called);
 return '<div class="meld">'+parts.map(v=>v!==called?tile(v.p):'<span class="taken'+(extra?' upgraded':'')+'"><span class="crosswise">'+tile(v.p)+'</span>'+(extra?'<span class="crosswise added">'+tile(extra.p)+'</span>':'')+'</span>').join('')+'</div>';
}
function optionContent(x){
 const [label,code]=x.split(' ');
 if(!code)return esc(label);
 const faces=['吃','碰','杠'].includes(label)?meldGroup(code):tile(code.slice(0,2));
 return '<span>'+esc(label)+'</span>'+faces;
}
function indicators(t,r){
 const ura=r.fubaopai;
 return '<div class="indicators"><div><b>表宝指示牌</b>'+t.dora.map(tile).join('')+'</div><div><b>里宝指示牌</b>'+(ura?.length?ura.map(tile).join(''):t.dora.map(()=>tile('back')).join('')+'<small>未立直</small>')+'</div></div>';
}
function tray(p,offset){
 const backs=offset?'<div class="backs" aria-label="暗手 '+p.count+' 张">'+Array.from({length:p.count},()=>tile('back')).join('')+'</div>':'';
 return backs+'<div class="melds">'+p.melds.map(meldGroup).join('')+'</div>';
}
function announce(e,t){
 const b=document.createElement('div');b.className='announcement';b.setAttribute('role','status');
 const name=document.createElement('small');name.textContent=winds[e.seat]+'家 · '+t.players[e.seat].name;
 const word=document.createElement('b');word.textContent=e.kind;b.append(name,word);document.body.append(b);
 setTimeout(()=>b.remove(),1350);
}
function winScreen(t,r){
 const groups=r.shoupai.split(','), hand=tiles(groups.shift()),last=hand.pop();
 const scores=t.players.map((p,i)=>'<div class="payout"><span>'+winds[i]+' · '+esc(p.name)+'</span><b>'+(r.fenpei[i]>0?'+':'')+r.fenpei[i]+'</b></div>').join('');
 const next=st.options.indexOf('继续');
 return '<section class="settlement"><small>'+t.round+' · '+t.honba+' 本场</small><h1>'+esc(t.players[r.l].name)+'　'+(r.baojia==null?'自摸':'荣和')+'</h1><p>'+(r.baojia==null?'自摸和牌':'放铳 · '+esc(t.players[r.baojia].name))+'</p><div class="winhand">'+hand.map(tile).join('')+'<span class="winning">'+tile(last)+'</span>'+groups.filter(Boolean).map(meldGroup).join('')+'</div>'+indicators(t,r)+'<h2>'+r.defen+' 点　<small>'+(r.damanguan?r.damanguan+' 倍役满':(r.fu?r.fu+' 符 ':'')+r.fanshu+' 番')+'</small></h2><div class="yaku">'+r.hupai.map(y=>'<span>'+esc(y.name)+'　'+(typeof y.fanshu==='number'?y.fanshu+'番':'役满')+'</span>').join('')+'</div>'+scores+(next>=0?'<button data-i="'+next+'">确认结算</button>':'<p>等待其他玩家确认</p>')+'</section>';
}
function drawScreen(t,r){
 const next=st.options.indexOf('继续');
 const players=[0,1,2,3].map(i=>{
  const p=t.players[i],revealed=r.shoupai[i],delta=r.fenpei[i];
  const label=winds[i]+'家 · '+esc(p.name)+'　'+(revealed?'听牌':'未听牌');
  const points=(delta>0?'+':'')+delta+' 点';
  if(!revealed)return '<div class="payout"><span>'+label+'</span><b>'+points+'</b></div>';
  const [closed,...melds]=revealed.split(',');
  return '<div class="payout"><span>'+label+'</span><b>'+points+'</b></div><div class="winhand revealed">'+tiles(closed).map(tile).join('')+melds.filter(Boolean).map(meldGroup).join('')+'</div>';
 }).join('');
 if(r.chomboSeat!=null)return '<section class="settlement"><h1>诈立</h1><p>'+esc(t.players[r.chomboSeat].name)+' 扣除 20 个半庄总分。本局重打，本场数维持原值。</p>'+(next>=0?'<button data-i="'+next+'">确认</button>':'<p>等待其他玩家确认</p>')+'</section>';
 return '<section class="settlement"><small>'+t.round+' · '+t.honba+' 本场</small><h1>流局</h1>'+players+(next>=0?'<button data-i="'+next+'">确认结算</button>':'<p>等待其他玩家确认</p>')+'</section>';
}
function deadWall(t){
 const columns=Array.from({length:7},(_,i)=>{
  const indicator=i>=2?t.dora[i-2]:null;
  const label=indicator?'宝牌指示牌 · '+tileName(indicator):i<2?'岭上牌位':'王牌';
  return '<span class="dead-stack" title="'+label+'"><span class="dead-bottom">'+tile('back')+'</span><span class="dead-top">'+tile(indicator||'back')+'</span></span>';
 });
 const names=t.dora.map(tileName).join('、');
 return '<div class="dead-wall" aria-label="王牌十四张">'+columns.join('')+'</div><div class="wall-caption">表宝 '+names+' · 岭上剩 '+t.rinshan+' 张</div>';
}
function fitTable(){
 const v=document.querySelector('.viewport3d');if(!v)return;
 const zoom=Math.min(v.clientWidth/1015,1.05);v.style.height=(zoom*846)+'px';v.style.setProperty('--zoom',zoom);
}
window.addEventListener('resize',fitTable);
function render(){
 el('lobby').hidden=true;el('room').hidden=false;el('title').textContent='房间 '+st.code;
 const dest=el('play'),t=st.table;
 if(st.final){dest.innerHTML='<div class="panel"><h2>半庄成绩</h2>'+st.names.map((n,i)=>'<p>'+esc(n)+'　'+st.final[i]+' pt</p>').join('')+'<button id="again">返回大厅</button></div>';el('again').onclick=()=>{sessionStorage.removeItem('table');location.href='/'};return}
 if(!t){dest.innerHTML='<div class="panel"><h2>等候入座</h2>'+Array.from({length:4},(_,i)=>'<p>'+('一二三四'[i])+'号席　'+esc(st.names[i]||'空席')+'</p>').join('')+(st.id===0?'<button id="start">开始半庄</button><p>开局时，电脑将补齐空席。</p>':'<p>等待房主开局</p>')+'</div>';if(el('start'))el('start').onclick=()=>call('start');return}
 function station(offset){
  const i=(t.l+offset)%4,p=t.players[i];
  const rack=offset?'<div class="rack">'+Array.from({length:p.count},()=>tile('back')).join('')+'</div>':'<div class="hand">'+h+'</div>';
  return '<section class="station" style="--bearing:'+(-90*offset)+'deg">'+rack+'<div class="mgroup">'+p.melds.map(meldGroup).join('')+'</div><div class="nameplate" data-seat="'+offset+'">'+(t.turn===i?'▸ ':'')+winds[i]+' · '+esc(p.name)+'　'+p.score+'</div><div class="pool">'+riverMarkup(p.river)+'</div></section>';
 }
 const opts=st.options, used=new Set(), hand=tiles(t.hand), actions=[];
 const declaring=opts.some(x=>x.startsWith('宣言 '));
 const prefix=declaring?'宣言 ':'打 ';
 const h=hand.map((p,k)=>{let i=opts.findIndex((x,i)=>!used.has(i)&&x===prefix+p+(k===hand.length-1?'_':''));if(i<0)i=opts.indexOf(prefix+p);if(i>=0)used.add(i);return '<button class="tile '+(p[1]==='0'?'red':'')+'" '+(i<0?'disabled':'data-i="'+i+'"')+' title="'+p+'">'+tile(p)+'</button>'}).join('');
 opts.forEach((x,i)=>{if(!used.has(i)&&!x.startsWith('宣言 '))actions.push('<button class="'+(/^(吃|碰|杠|立直|自摸|荣和|公开听牌)/.test(x)?'claim':'')+'" data-i="'+i+'">'+optionContent(x)+'</button>')});
 const result=st.result;
 dest.innerHTML=result?(result.hupai?winScreen(t,result):drawScreen(t,result)):'<div class="viewport3d"><div class="camera"><div id="desk" class="table3d">'+[0,1,2,3].map(station).join('')+'<div class="hub"><b>'+t.round+'　'+t.honba+' 本场</b><p>余 '+t.left+' 枚 · <span id="pot">供托 '+t.sticks+(t.sticks?' <i class="stick"></i>':'')+'</span></p>'+deadWall(t)+'</div></div></div></div><p class="mobile-dora">宝牌指示牌 '+t.dora.map(tileName).join('、')+'</p><div class="touchhand hand">'+h+'</div><p>'+(declaring?'请选择立直宣言牌':t.drawReveal?(opts.length?'荒牌流局 · 公开手牌才能按听牌结算':'荒牌流局 · 等待听牌者选择是否公开'):opts.length?(opts.some(x=>x.startsWith('打 '))?'请选择要打出的牌':'请选择操作'):'等待其他雀士')+'</p><div class="actions">'+actions.join('')+'</div>';
 fitTable();playEffects(t);
 dest.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>call('act',{nonce:st.nonce,i:+b.dataset.i}));
}
el('create').onclick=()=>call('create',{name:el('nick').value});el('join').onclick=()=>call('join',{name:el('nick').value,code:el('code').value});
el('copy').onclick=async()=>{const invitation=new URL(location.href);if(st.lan&&['localhost','127.0.0.1'].includes(location.hostname))invitation.hostname=st.lan;invitation.search='?room='+st.code;const url=invitation.href;try{await navigator.clipboard.writeText(url);el('copy').textContent='邀请已复制'}catch{prompt('复制房间邀请',url)}};
if(auth.token)call('state');setInterval(()=>{if(auth.token)call('state')},400);
